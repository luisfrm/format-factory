name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows (x64)
            os: windows-latest
            bundles: msi,nsis
            artifact: windows-x64
          - label: Linux (x64)
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux-x64
          - label: macOS (Apple Silicon)
            os: macos-latest
            bundles: dmg
            artifact: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision FFmpeg sidecars for this platform
        run: pnpm setup:binaries

      - name: Run tests
        run: pnpm test && pnpm test:rust

      - name: Build bundles
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: format-factory-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/format-factory
            src-tauri/target/release/format-factory.exe
