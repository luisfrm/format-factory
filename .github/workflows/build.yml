name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: "Completar un release en borrador o republicar tras un fallo (no sobreescribe releases publicados)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: only the publish job may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # 1. Decide whether this run publishes anything
  # ------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read version and release state
        id: read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Pull requests and tag-less events never publish.
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION ya existe; solo se compila para verificar."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION es nueva; se publicará al terminar."
          fi

  # ------------------------------------------------------------------
  # 2. Dependency audit (informational, never blocks a release)
  # ------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  # ------------------------------------------------------------------
  # 3. Build the three platforms in parallel
  # ------------------------------------------------------------------

  build:
    name: ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            bundles: msi,nsis
            artifact: windows-x64
            suffix: windows-x64
          - label: Linux x64
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux-x64
            suffix: linux-x64
          - label: macOS arm64
            os: macos-latest
            bundles: dmg
            artifact: macos-arm64
            suffix: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        # Sin `version:` a propósito: la versión vive en package.json → packageManager.

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision FFmpeg sidecars
        run: pnpm setup:binaries

      # generate_context! embeds `dist/`, so the frontend must exist before any
      # Rust compilation (including `cargo test`).
      - name: Build frontend
        run: pnpm bundle

      - name: Unit tests
        run: pnpm test

      - name: Rust tests
        run: pnpm test:rust

      - name: Package installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Normalize artifact names
        run: node scripts/collect-artifacts.mjs --from src-tauri/target/release/bundle --out stage --updater --prefix "Format-Factory_${{ needs.version.outputs.version }}_${{ matrix.suffix }}"

      - name: Upload platform files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files-${{ matrix.artifact }}
          path: stage/*
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 4. Publish a single GitHub Release with every platform
  # ------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true' || inputs.force
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-files-*
          merge-multiple: true
          path: release

      - name: Add install instructions
        run: cp docs/INSTALL.md release/INSTALL.md

      - name: Generate update manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/collect-artifacts.mjs \
            --latest-json release \
            --version "$VERSION" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v$VERSION"

      - name: Generate checksums
        run: node scripts/collect-artifacts.mjs --checksums release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "release/*"

      - name: List release contents
        run: ls -lh release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"

          # Los releases son inmutables: se crea en borrador, se suben los
          # assets y solo entonces se publica. Un release ya publicado no se
          # puede modificar; para corregirlo hay que subir la versión.
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::$TAG ya está publicado e inmutable. Ejecuta 'pnpm release patch'."
              exit 1
            fi
            echo "Completando borrador $TAG"
          else
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Format Factory $TAG" \
              --generate-notes
          fi

          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false

          echo "### Release $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
