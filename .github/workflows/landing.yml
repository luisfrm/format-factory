name: Landing

on:
  push:
    branches: [master]
    paths:
      - "landing/**"
      - ".github/workflows/landing.yml"
  pull_request:
    branches: [master]
    paths:
      - "landing/**"
      - ".github/workflows/landing.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Producción se serializa; cada PR mantiene su propio grupo de verificación.
  group: landing-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar landing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: landing
        run: pnpm check

      - name: Build
        working-directory: landing
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_DOWNLOAD_BASE: ${{ vars.PUBLIC_DOWNLOAD_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build

  deploy:
    name: Desplegar en Workers
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: landing
        run: pnpm check

      - name: Build
        working-directory: landing
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_DOWNLOAD_BASE: ${{ vars.PUBLIC_DOWNLOAD_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build

      - name: Deploy
        working-directory: landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
